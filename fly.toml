# fly.toml app configuration file generated for pkp-backend on 2025-01-09T15:02:36+02:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'pkp-backend'
primary_region = 'arn'

[env]
  PORT = '3000'
  SERVICE_URL = https://pkp-backend.fly.dev

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
